<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Which Car</title>
<style>
  :root{
    --bg: #14161a;
    --panel: #1d2026;
    --panel-edge: #2a2e36;
    --text: #f2f1ed;
    --muted: #83878e;
    --gas: #e0a63a;
    --gas-dim: #4a3c1e;
    --ev: #3fc7b0;
    --ev-dim: #1c3e39;
    --warn: #c25a4a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    padding:28px 32px 20px;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  .head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
  }
  h1{
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .updated{
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .legend{
    display:flex;
    gap:18px;
    font-size:12px;
    color:var(--muted);
    margin-bottom:16px;
  }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%;}
  .dot.gas{background:var(--gas);}
  .dot.ev{background:var(--ev);}

  .rows{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
  }
  .row{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-left:4px solid var(--panel-edge);
    border-radius:6px;
    padding:14px 16px;
    display:grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    align-items:center;
    gap:12px;
  }
  .row.win-gas{border-left-color:var(--gas);}
  .row.win-ev{border-left-color:var(--ev);}

  .dest{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .dest-name{font-size:16px; font-weight:600;}
  .dest-dist{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}

  .cost-col{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:6px 10px;
    border-radius:5px;
  }
  .cost-col.chosen.gas{background:var(--gas-dim);}
  .cost-col.chosen.ev{background:var(--ev-dim);}
  .cost-label{
    font-size:11px;
    color:var(--muted);
  }
  .cost-value{
    font-size:20px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .cost-col.chosen.gas .cost-value{color:var(--gas);}
  .cost-col.chosen.ev .cost-value{color:var(--ev);}
  .note{
    font-size:10.5px;
    color:var(--warn);
    margin-top:1px;
  }

  .status{
    font-size:13px;
    color:var(--muted);
    padding:20px 0;
  }
  .error{color:var(--warn);}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Which car should I take?</h1>
    <div class="updated" id="updated">—</div>
  </div>
  <div class="legend">
    <span><span class="dot gas"></span>2017 Ford Escape · 20 mpg</span>
    <span><span class="dot ev"></span>Ioniq 5 · electric</span>
  </div>
  <div class="rows" id="rows">
    <div class="status">Loading distances…</div>
  </div>
</div>

<script>
/* ============== CONFIG — edit this block ============== */
const CONFIG = {
  apiKey: "AIzaSyDzVkzG-tOw-o6YvgpXabAJ6piu8j0W378",   // Maps JavaScript API key (restrict by HTTP referrer to the domain this page is hosted on)
  origin: “823” E Linus St, Milwaukee, WI 53207,  // starting point for all trips

  destinations: [
    “11270 W Park Pl, Milwaukee, WI 5”3224,   // SPS
    “N91 W15750, Menomonee Falls, WI 53051”, // OSSC
    “2607 S 5th St, Milwaukee, WI 53207”, // Aug Prep
    “2121 S Kinnickinnic Ave, Milwaukee, WI 53207”, // gym
    “1204 W Layton Ave, Milwaukee, WI 53221”, // Playtime
    // add as many as you like — one string per stop
  ],

  gasPricePerGallon: 3.99,     // update to local price
  escapeMpg: 20,

  elecPricePerKwh: 0.15342,       // your electricity rate
  ioniqMilesPerKwh: 3.8,       // real-world efficiency estimate
  ioniqRangeMiles: 250,        // conservative real-world range

  refreshMinutes: 30           // how often to re-query distances
};
/* ========================================================= */

function fmtMoney(n){
  return "$" + n.toFixed(2);
}

function renderRows(results){
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = "";

  results.forEach(r => {
    if (r.error){
      const row = document.createElement('div');
      row.className = "row";
      row.innerHTML = `<div class="dest"><div class="dest-name">${r.name}</div>
        <div class="dest-dist error">Could not get distance</div></div><div></div><div></div>`;
      rowsEl.appendChild(row);
      return;
    }

    const miles = r.miles;
    const gasCost = (miles / CONFIG.escapeMpg) * CONFIG.gasPricePerGallon;
    const evCost = (miles / CONFIG.ioniqMilesPerKwh) * CONFIG.elecPricePerKwh;
    const roundTrip = miles * 2;
    const evInRange = roundTrip <= CONFIG.ioniqRangeMiles;

    let winner;
    if (!evInRange){
      winner = "gas";
    } else {
      winner = evCost <= gasCost ? "ev" : "gas";
    }

    const row = document.createElement('div');
    row.className = "row win-" + winner;

    const evNote = !evInRange
      ? `<div class="note">Round trip exceeds EV range</div>`
      : "";

    row.innerHTML = `
      <div class="dest">
        <div class="dest-name">${r.name}</div>
        <div class="dest-dist">${miles.toFixed(1)} mi · ${r.duration}</div>
      </div>
      <div class="cost-col ${winner === 'gas' ? 'chosen gas' : ''}">
        <div class="cost-label">Escape</div>
        <div class="cost-value">${fmtMoney(gasCost)}</div>
      </div>
      <div class="cost-col ${winner === 'ev' ? 'chosen ev' : ''}">
        <div class="cost-label">Ioniq 5</div>
        <div class="cost-value">${fmtMoney(evCost)}</div>
        ${evNote}
      </div>
    `;
    rowsEl.appendChild(row);
  });

  document.getElementById('updated').textContent =
    "Updated " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function loadGoogleMaps(callback){
  if (window.google && window.google.maps){ callback(); return; }
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.apiKey}`;
  script.onload = callback;
  script.onerror = () => {
    document.getElementById('rows').innerHTML =
      `<div class="status error">Could not load Google Maps. Check the API key in CONFIG.</div>`;
  };
  document.head.appendChild(script);
}

function fetchDistances(){
  const service = new google.maps.DistanceMatrixService();
  service.getDistanceMatrix({
    origins: [CONFIG.origin],
    destinations: CONFIG.destinations,
    travelMode: google.maps.TravelMode.DRIVING,
    unitSystem: google.maps.UnitSystem.IMPERIAL
  }, (response, status) => {
    if (status !== "OK"){
      document.getElementById('rows').innerHTML =
        `<div class="status error">Distance Matrix request failed: ${status}</div>`;
      return;
    }

    const elements = response.rows[0].elements;
    const results = CONFIG.destinations.map((name, i) => {
      const el = elements[i];
      if (el.status !== "OK"){
        return { name, error: true };
      }
      return {
        name,
        miles: el.distance.value / 1609.34,
        duration: el.duration.text
      };
    });

    renderRows(results);
  });
}

loadGoogleMaps(() => {
  fetchDistances();
  setInterval(fetchDistances, CONFIG.refreshMinutes * 60 * 1000);
});
</script>
</body>
</html>
